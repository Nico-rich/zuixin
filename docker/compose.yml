services:
  postgres:
    # ⚠️ 镜像锁定约束（2026-09-24 修复记录）：
    # 本镜像为 Debian/glibc。数据卷 pgdata 于 M5-P1 从 postgres:16-alpine（musl）迁移而来，
    # text 列 btree 索引因 libc/collation 不一致发生过索引损坏（Provider 重复主键 + Prisma nested_read panic）。
    # 已通过「去重 + REINDEX DATABASE」修复。此后禁止切回 alpine/musl 系镜像复用同一数据卷；
    # 若必须更换镜像，须同 libc（Debian/glibc 系）或在更换后立即执行 REINDEX DATABASE。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_password
      POSTGRES_DB: agent_platform
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # M10: databases=64——并行 worktree e2e 按 DB 号隔离（铁律）；默认 16 会越界并静默落 db0
    command: ["redis-server", "--databases", "64"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/agent-storage || true;
      mc anonymous set none local/agent-storage;
      exit 0"

volumes:
  pgdata:
  miniodata:
