# M10-P9 运维交付：**非敏感**运行时配置（API 与 Worker 共用）。
#
# 纪律：任何密钥/口令/连接串都不得出现在这里——它们走 Secret（secret.example.yaml）。
# 判断标准：`kubectl get configmap -o yaml` 的输出被贴进工单也不应造成任何泄露。
#
# 镜像纪律（容易踩）：apps/api/src/env.ts 会按 `../../.env`、`.env` 顺序加载 dotenv，
# 且**第二次调用带 override: true**。所以镜像的工作目录里**绝不能**存在 `.env` 文件——
# 否则它会覆盖下面这些值以及 Secret 注入的 DATABASE_URL/JWT_SECRET（.dockerignore 里加 `.env`）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-config
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/part-of: agent-platform
data:
  # --- 运行时形态 ---
  NODE_ENV: "production"            # 生产守卫（M10-P1）依赖此值：默认密钥/SEED 口令/mock adapter 在此值下应当 fail-fast
  LOG_LEVEL: "info"                 # pino 级别；排障时临时调 debug（受 common/logging/pino-logging.ts 约束）

  # --- API 监听 ---
  API_PORT: "3001"                  # src/main.ts 读取；探针端口必须与此一致
  APP_URL: "https://app.example.com"
  CORS_ORIGINS: "https://app.example.com"   # 逗号分隔白名单；modules/security/cors-policy.ts 解析

  # --- 优雅停机（见 lifecycle/graceful-shutdown.ts）---
  GRACEFUL_SHUTDOWN_TIMEOUT_MS: "30000"     # 应用侧兜底：到点记 phase:timeout 并 exit(1)
  SCHEDULER_SHUTDOWN_WAIT_MS: "25000"       # Scheduler 在途作业收尾窗口（必须 < 上面的值）

  # --- 健康探测 ---
  HEALTH_PROBE_TIMEOUT_MS: "1000"           # 单个探测硬超时；三项并行 ⇒ /ready 最坏 ≈2×该值

  # --- 观测 ---
  QUEUE_DEPTH_INTERVAL_MS: "60000"          # Worker 独有的队列深度采样周期（core/tracing/queue-depth.sampler.ts）

  # --- 对象存储（非敏感部分；凭证见 Secret）---
  STORAGE_DRIVER: "s3"              # 生产用 s3（MinIO/S3 兼容）；local 驱动需要挂载可写卷，不建议在生产用
  STORAGE_ENDPOINT: "https://minio.internal.example.com"
  STORAGE_BUCKET: "agent-storage"
  STORAGE_REGION: "us-east-1"
  # STORAGE_LOCAL_DIR 仅在 STORAGE_DRIVER=local 时有意义（生产不建议）
  #
  # 注意：**没有** REDIS_HOST/POSTGRES_HOST 这类变量——代码只认 DATABASE_URL / REDIS_URL 完整连接串
  # （apps/api/src/env.ts），所以这两个地址连同口令一起放在 Secret 里。
  # 多实例隔离：演练环境用 REDIS_URL 尾部的 /<db> 号区分（见 docs/operations/m10-runbook.md §1）。
