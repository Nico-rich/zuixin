# M10-P9 运维交付：**Secret 模板**（示例文件；真实值绝不入仓）。
#
# 这是"该有哪些键"的清单，不是可用对象：所有值都是 REPLACE_ME。
# 三种落地方式（推荐度从高到低）：
#   1. External Secrets / Sealed Secrets / Vault Agent 注入（生产推荐：密钥不落 Git、可轮换、可审计）
#   2. kubectl create secret generic agent-platform-secrets -n agent-platform \
#        --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#        --from-literal=ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#        --from-literal=DATABASE_URL="postgresql://agent:<pw>@<host>:5432/agent_platform?schema=public" \
#        --from-literal=REDIS_URL="redis://:<pw>@<host>:6379/0" \
#        --from-literal=STORAGE_ACCESS_KEY_ID=... --from-literal=STORAGE_SECRET_ACCESS_KEY=...
#      （--from-literal 不经磁盘；但注意命令会进 shell history ⇒ 用 `set +o history` 或从文件读）
#   3. 直接 apply 本文件（仅限演练；apply 完立刻删除本地副本，且**不要** git add）
#
# RPO=0 清单（**丢了就真的没了**，必须与数据库备份分开放且同等加密，见 m10-runbook.md §3）：
#   ENCRYPTION_KEY —— 丢失 ⇒ 全部已存凭证（Connection/Credential）与 webhook secret 永久不可解；
#                      *备份文件里只有密文，没有它就是废纸*，恢复演练必须抽查解密（m10-runbook.md §4.5）。
#   JWT_SECRET     —— 丢失 ⇒ 所有会话失效（可接受，用户重登即可），但**不能**与 ENCRYPTION_KEY 混用同一值。
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-secrets
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/part-of: agent-platform
type: Opaque
stringData:
  # 生成：openssl rand -base64 48 / openssl rand -base64 32（长度与随机性要求见 .env.example）
  JWT_SECRET: "REPLACE_ME_openssl_rand_base64_48"
  ENCRYPTION_KEY: "REPLACE_ME_openssl_rand_base64_32"
  # 口令放连接串里（代码只认完整 URL）；URL 编码口令中的特殊字符
  DATABASE_URL: "postgresql://agent:REPLACE_ME@postgres.internal.example.com:5432/agent_platform?schema=public"
  REDIS_URL: "redis://:REPLACE_ME@redis.internal.example.com:6379/0"
  STORAGE_ACCESS_KEY_ID: "REPLACE_ME"
  STORAGE_SECRET_ACCESS_KEY: "REPLACE_ME"
  # --- seed 用管理员（M11-P10 E-07：这两点必须读清楚，否则生产 Pod 起不来）---
  # ① **SEED_ADMIN_PASSWORD 必须在本常驻 Secret 里存在，且是强口令**——不是"只有 seed Job 才需要"：
  #    production-guards 的检查 ④（apps/api/src/modules/security/production-guards.ts:135）在 NODE_ENV=production
  #    下把「缺失 / 占位 / 开发默认名单纯口令」判为违规，而 assertProductionSafety 是**启动期 fail-fast**
  #    （main.ts:78；M11-P10 E-08 起 worker.ts 也已接线）⇒ 本键缺失或是占位值时，**API 与 Worker 两个
  #    Deployment 都会 CrashLoopBackOff**（日志为「生产环境安全守卫失败（NODE_ENV=production），拒绝启动」）。
  #    强口令口径（含 seed 脚本自身的第二道闸 prisma/seed.ts → assertSeedPasswordSafe）：
  #    长度 ≥ 12、不在默认名单（admin123456/admin123/changeme/password/123456）、不含 change_me/replace_me 等占位子串。
  # ② 与"一次性 Job 注入"的取舍（两选一，别踩中间态）：
  #    方案 A（简单）：本 Secret 放强口令，seed 与 Pod 共用同一个值。代价是该口令长期留在集群 Secret 里
  #      （有 kubectl get secret 权限的人可读），且 seed 的首个 admin 口令等于它。
  #    方案 B（最小心，推荐）：**仍**在本 Secret 放一个强口令值满足守卫（Pod 才能起），
  #      真正的初始口令只在一次性 seed Job 上用**自己的 env 覆盖**注入（容器的 env 优先级高于 envFrom）——
  #      于是"常驻 Secret 里那个值从未被用于建号"，初始口令不进任何常驻清单，seed 完成后 Job 即销毁。
  #      注意：方案 B 不能省掉本 Secret 里的强值，否则就是上面 ① 的 CrashLoopBackOff。
  # ③ SEED_ADMIN_EMAIL 不受守卫检查（缺省为 admin@example.com）；生产建议与口令一起由 Job 显式注入，
  #    免得留下一个人尽皆知的登录名。首个 admin 建好后请尽快改密/轮换（走应用接口，不靠改 Secret）。
  SEED_ADMIN_PASSWORD: "REPLACE_ME_strong_password_min_12_chars"
  # SEED_ADMIN_EMAIL 由一次性 seed Job 注入（也可放这里，但没必要常驻）。
